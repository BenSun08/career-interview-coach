[project]
name = "career-helper"
version = "0.1.0"
description = "A private, local-first career and interview coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "gunicorn>=23,<24",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".agents", ".codex", ".specify", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["career_helper/domain", "career_helper/application"]
strict = true
warn_unreachable = true
show_error_codes = true
